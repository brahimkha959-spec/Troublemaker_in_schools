<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101014">
<title>فصل دراسي 3D — منظور شخص أول</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    overflow: hidden; background: #101014;
    font-family: "Segoe UI", Tahoma, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; touch-action: none; }

  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    box-shadow: 0 0 0 2px rgba(0,0,0,.35);
    pointer-events: none;
    display: none; z-index: 4;
  }

  #fsBtn {
    position: fixed;
    top: max(15px, env(safe-area-inset-top));
    right: max(15px, env(safe-area-inset-right));
    width: 44px; height: 44px;
    border-radius: 10px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 20px;
    z-index: 15; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    touch-action: manipulation;
  }

  #joystick {
    position: fixed;
    bottom: max(30px, env(safe-area-inset-bottom));
    left: max(30px, env(safe-area-inset-left));
    width: clamp(110px, 30vmin, 150px);
    height: clamp(110px, 30vmin, 150px);
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.22);
    display: none;
    touch-action: none; z-index: 5;
    transition: background .15s, border-color .15s;
  }
  #joystick.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.45); }
  #joystick::before {
    content: ''; position: absolute; inset: 32%;
    border-radius: 50%; border: 1px dashed rgba(255,255,255,0.18); pointer-events: none;
  }
  #joystickKnob {
    position: absolute; top: 50%; left: 50%;
    width: clamp(50px, 13vmin, 70px);
    height: clamp(50px, 13vmin, 70px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(255,255,255,0.25));
    border: 2px solid rgba(255,255,255,0.6);
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }

  #jumpBtn {
    position: fixed;
    bottom: max(45px, env(safe-area-inset-bottom));
    right: max(30px, env(safe-area-inset-right));
    width: clamp(75px, 19vmin, 100px);
    height: clamp(75px, 19vmin, 100px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(142,231,192,0.5), rgba(79,209,161,0.28));
    border: 2px solid rgba(79,209,161,0.75);
    color: #fff; font-size: clamp(24px, 6vmin, 32px);
    z-index: 5; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    touch-action: none;
    box-shadow: 0 6px 20px rgba(79,209,161,0.3);
    font-weight: 700;
    transition: transform .08s, background .15s;
  }
  #jumpBtn.pressed {
    transform: scale(0.92);
    background: radial-gradient(circle at 35% 35%, rgba(142,231,192,0.85), rgba(79,209,161,0.55));
  }

  body.touch-mode.playing #joystick,
  body.touch-mode.playing #jumpBtn { display: flex; }

  #overlay {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 40%, #23242e, #0b0b10 70%);
    color: #e9eaf0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 18px;
    cursor: pointer; z-index: 10;
    padding: 24px;
    user-select: none;
  }
  #overlay h1 { font-size: clamp(22px, 5vw, 40px); font-weight: 700; letter-spacing: .5px; }
  #overlay p { font-size: clamp(13px, 2vw, 17px); color: #9aa0b5; line-height: 2; max-width: 560px; }
  #overlay kbd {
    background: #2b2d3a; border: 1px solid #3d4055; border-bottom-width: 3px;
    border-radius: 6px; padding: 2px 8px; font-family: monospace; color: #cfd3e6;
    display: inline-block; margin: 0 1px;
  }
  #startBtn {
    margin-top: 10px; padding: 14px 42px; font-size: 17px; font-weight: 600;
    color: #0b0b10; background: linear-gradient(180deg,#8ee7c0,#4fd1a1);
    border: none; border-radius: 40px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(79,209,161,.35);
    transition: transform .15s;
    touch-action: manipulation;
  }
  #startBtn:hover { transform: translateY(-2px); }

  #rotateHint {
    position: fixed; inset: 0;
    background: rgba(11,11,16,0.97);
    color: #e9eaf0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    z-index: 20; text-align: center; padding: 24px;
    pointer-events: none;
  }
  #rotateHint .icon { font-size: 64px; animation: rotateIcon 2.2s ease-in-out infinite; }
  @keyframes rotateIcon {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  @media (orientation: portrait) and (pointer: coarse) {
    body.playing #rotateHint { display: flex; }
  }
</style>
</head>
<body>

<div id="crosshair"></div>
<div id="joystick"><div id="joystickKnob"></div></div>
<button id="jumpBtn" aria-label="قفز">↑</button>
<button id="fsBtn" aria-label="ملء الشاشة">⛶</button>

<div id="rotateHint">
  <div class="icon">📱</div>
  <div style="font-size:18px;font-weight:600;max-width:320px;">أدر جهازك أفقياً للحصول على تجربة أفضل</div>
</div>

<div id="overlay">
  <h1>🏫 فصل دراسي — منظور شخص أول</h1>
  <p id="controlsText"></p>
  <button id="startBtn">انقر للدخول إلى الفصل</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ============ كشف الجوال ============ */
const isMobileMode = window.matchMedia('(pointer: coarse)').matches;
if (isMobileMode) document.body.classList.add('touch-mode');

/* ============ إعدادات ============ */
const ROOM_SIZE   = 20;
const ROOM_HEIGHT = 4;
const HALF        = ROOM_SIZE / 2;
const EYE_HEIGHT  = 1.7;
const RADIUS      = 0.35;
const SPEED       = 4.2;
const RUN_MULT    = 1.7;
const GRAVITY     = 20;
const JUMP_FORCE  = 6;
const LOOK_SENS   = 0.0035;

/* ============ عناصر DOM ============ */
const overlay     = document.getElementById('overlay');
const crosshair   = document.getElementById('crosshair');
const startBtn    = document.getElementById('startBtn');
const fsBtn       = document.getElementById('fsBtn');
const jumpBtn     = document.getElementById('jumpBtn');
const joystick    = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystickKnob');
const controlsText = document.getElementById('controlsText');

controlsText.innerHTML = isMobileMode
  ? 'حرّك بالعصا اليسرى • انظر بالسحب على الشاشة • اقفز بالزر الأيمن'
  : '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> للحركة • <kbd>الفأرة</kbd> للنظر • <kbd>Space</kbd> للقفز • <kbd>Shift</kbd> للجري • <kbd>Esc</kbd> للخروج';

/* ============ المشهد ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181f);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, EYE_HEIGHT, 7.5);
if (isMobileMode) camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ============ الإضاءة ============ */
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4a44, 1.2));

const sun = new THREE.DirectionalLight(0xfff4e0, 1.2);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -HALF - 2;
sun.shadow.camera.right  =  HALF + 2;
sun.shadow.camera.top    =  HALF + 2;
sun.shadow.camera.bottom = -HALF - 2;
sun.shadow.camera.far    = 40;
sun.shadow.bias = -0.0005;
scene.add(sun);

// إضاءة سقف (نيون)
function addCeilingLight(x, z) {
  const fixture = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.08, 0.45),
    new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0xFFF8E0, emissiveIntensity: 2.2 })
  );
  fixture.position.set(x, 3.94, z);
  scene.add(fixture);
  const pl = new THREE.PointLight(0xFFF2D6, 22, 14, 2);
  pl.position.set(x, 3.7, z);
  scene.add(pl);
}
addCeilingLight(-4.5, -4);
addCeilingLight( 4.5, -4);
addCeilingLight(-4.5,  2);
addCeilingLight( 4.5,  2);
addCeilingLight( 0,    7);

/* ============ الأرضية — بلاط مشطور ============ */
function makeTileTexture(size = 512, squares = 10, c1 = '#DDD8C8', c2 = '#CBC6B4') {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const s = size / squares;
  for (let y = 0; y < squares; y++) {
    for (let x = 0; x < squares; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? c1 : c2;
      ctx.fillRect(x * s, y * s, s, s);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x * s, y * s, s, s);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const floorTex = makeTileTexture();
floorTex.repeat.set(3, 3);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ============ الجدران + السقف ============ */
const wallMat = new THREE.MeshStandardMaterial({ color: 0xEDE8DC, roughness: 0.95, side: THREE.DoubleSide });
const ceilMat = new THREE.MeshStandardMaterial({ color: 0xF5F5F0, roughness: 1 });

function addWall(w, h, pos, rotY) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.copy(pos);
  m.rotation.y = rotY;
  m.receiveShadow = true;
  scene.add(m);
}
addWall(ROOM_SIZE, ROOM_HEIGHT, new THREE.Vector3(0, ROOM_HEIGHT / 2, -HALF), 0);
addWall(ROOM_SIZE, ROOM_HEIGHT, new THREE.Vector3(0, ROOM_HEIGHT / 2,  HALF), Math.PI);
addWall(ROOM_SIZE, ROOM_HEIGHT, new THREE.Vector3(-HALF, ROOM_HEIGHT / 2, 0), Math.PI / 2);
addWall(ROOM_SIZE, ROOM_HEIGHT, new THREE.Vector3( HALF, ROOM_HEIGHT / 2, 0), -Math.PI / 2);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), ceilMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ROOM_HEIGHT;
ceiling.receiveShadow = true;
scene.add(ceiling);

/* ============ نظام التصادم ============ */
const colliders = [];
function addBox(w, h, d, x, y, z, color, solid = true, metalness = 0.05) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness })
  );
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  if (solid) colliders.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
  return mesh;
}

/* ============ السبورة + نص طبشور ============ */
function makeBlackboardTexture() {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 288;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#284A3A';
  ctx.fillRect(0, 0, cv.width, cv.height);

  // نسيج بسيط
  for (let i = 0; i < 800; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.025})`;
    ctx.fillRect(Math.random() * cv.width, Math.random() * cv.height, 2, 2);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'right';
  ctx.font = 'bold 52px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('الرياضيات', cv.width - 45, 35);

  ctx.font = '34px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('الجمع والطرح — الوحدة الأولى', cv.width - 45, 105);

  ctx.font = 'bold 44px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('٣ + ٥ = ٨', cv.width - 45, 170);

  // خط تحت
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cv.width - 380, 240);
  ctx.lineTo(cv.width - 45, 240);
  ctx.stroke();

  // تاريخ
  ctx.font = '24px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.textAlign = 'left';
  ctx.fillText('الاثنين ٢٠٢٦/١١/١٨', 45, 240);

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// إطار خشبي
addBox(8.4, 2.0, 0.08, 0, 1.55, -9.94, 0x4A2E18, false);
// السبورة
const boardMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(8.0, 1.8),
  new THREE.MeshStandardMaterial({ map: makeBlackboardTexture(), roughness: 0.9 })
);
boardMesh.position.set(0, 1.6, -9.87);
scene.add(boardMesh);

// حامل الطباشير
addBox(8.2, 0.06, 0.16, 0, 0.62, -9.82, 0x6B4A2E, false);
// طباشير
addBox(0.11, 0.04, 0.04, -1.2, 0.68, -9.82, 0xFFFFFF, false);
addBox(0.11, 0.04, 0.04,  0.3, 0.68, -9.82, 0xFFE0A0, false);
// ممحاة
addBox(0.22, 0.06, 0.1, 2.5, 0.68, -9.82, 0x222222, false);

/* ============ طاولة المعلم ============ */
addBox(2.6, 0.75, 1.0, 0, 0, -6.6, 0x7A5230);              // جسم
addBox(2.7, 0.08, 1.1, 0, 0.75, -6.6, 0x9C6B3D);           // سطح
// كتب على الطاولة
addBox(0.35, 0.06, 0.25, -0.6, 0.83, -6.7, 0xB03A3A, false);
addBox(0.35, 0.06, 0.25, -0.6, 0.89, -6.7, 0x3A5FA0, false);
addBox(0.35, 0.06, 0.25, -0.6, 0.95, -6.7, 0x3A8A4A, false);
// كوب أقلام
addBox(0.12, 0.16, 0.12, 0.7, 0.83, -6.6, 0xCCAA55, false);
// كرة أرضية
const globeBase = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.09, 0.04, 16),
  new THREE.MeshStandardMaterial({ color: 0x4A2E18 })
);
globeBase.position.set(0.9, 0.85, -6.7); scene.add(globeBase);
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 20, 16),
  new THREE.MeshStandardMaterial({ color: 0x3B7BC4, roughness: 0.6 })
);
globe.position.set(0.9, 1.02, -6.7); globe.castShadow = true; scene.add(globe);

// كرسي المعلم
addBox(0.55, 0.05, 0.55, 0, 0.48, -5.7, 0x2A3542, false);
addBox(0.05, 0.48, 0.05, -0.22, 0, -5.9, 0x1E2630, false);
addBox(0.05, 0.48, 0.05,  0.22, 0, -5.9, 0x1E2630, false);
addBox(0.05, 0.48, 0.05, -0.22, 0, -5.5, 0x1E2630, false);
addBox(0.05, 0.48, 0.05,  0.22, 0, -5.5, 0x1E2630, false);
addBox(0.55, 0.55, 0.05, 0, 0.5, -5.42, 0x2A3542, false);

/* ============ مكاتب الطلاب (4 صفوف × 4 أعمدة) ============ */
function addStudentDesk(x, z) {
  const woodT = 0xD4A574;
  const woodL = 0x8B6B3E;
  const chair  = 0x3A4A5A;
  const chairD = 0x2A3542;

  // سطح المكتب
  addBox(1.05, 0.05, 0.55, x, 0.72, z, woodT, false);
  // 4 أرجل
  addBox(0.05, 0.72, 0.05, x - 0.46, 0, z - 0.22, woodL, false);
  addBox(0.05, 0.72, 0.05, x + 0.46, 0, z - 0.22, woodL, false);
  addBox(0.05, 0.72, 0.05, x - 0.46, 0, z + 0.22, woodL, false);
  addBox(0.05, 0.72, 0.05, x + 0.46, 0, z + 0.22, woodL, false);

  // كرسي — مقعد
  addBox(0.45, 0.05, 0.45, x, 0.45, z + 0.62, chair, false);
  // أرجل الكرسي
  addBox(0.045, 0.45, 0.045, x - 0.18, 0, z + 0.44, chairD, false);
  addBox(0.045, 0.45, 0.045, x + 0.18, 0, z + 0.44, chairD, false);
  addBox(0.045, 0.45, 0.045, x - 0.18, 0, z + 0.80, chairD, false);
  addBox(0.045, 0.45, 0.045, x + 0.18, 0, z + 0.80, chairD, false);
  // ظهر الكرسي
  addBox(0.45, 0.48, 0.05, x, 0.5, z + 0.84, chair, false);

  // تصادم موحّد: مكتب + كرسي
  colliders.push({ minX: x - 0.55, maxX: x + 0.55, minZ: z - 0.3, maxZ: z + 0.9 });
}

const COL_X = [-3.9, -1.3, 1.3, 3.9];
const ROW_Z = [-4.0, -1.8, 0.4, 2.6];
const studentSpots = [];
COL_X.forEach(x => ROW_Z.forEach(z => {
  addStudentDesk(x, z);
  studentSpots.push([x, z]);
}));

// كتب وأقلام على بعض المكاتب
const BOOK_COLORS = [0xB03A3A, 0x3A5FA0, 0x3A8A4A, 0xD08A2A, 0x7A3AA0];
studentSpots.forEach(([x, z], i) => {
  if (i % 3 === 0) {
    addBox(0.3, 0.05, 0.22, x, 0.77, z - 0.02, BOOK_COLORS[i % BOOK_COLORS.length], false);
  }
  if (i % 4 === 1) {
    addBox(0.05, 0.14, 0.05, x + 0.25, 0.77, z + 0.05, 0xF0D040, false); // قلم
  }
});

/* ============ ساعة حائط ============ */
const clockBack = new THREE.Mesh(
  new THREE.CircleGeometry(0.42, 32),
  new THREE.MeshStandardMaterial({ color: 0xF5F5F5 })
);
clockBack.position.set(0, 3.0, -9.94);
scene.add(clockBack);

const clockRim = new THREE.Mesh(
  new THREE.RingGeometry(0.42, 0.49, 32),
  new THREE.MeshStandardMaterial({ color: 0x1A1A1A, side: THREE.DoubleSide })
);
clockRim.position.set(0, 3.0, -9.93);
scene.add(clockRim);

// عقارب
const handMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const hourHand = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 0.22), handMat);
hourHand.position.set(0, 3.0 + 0.08, -9.92);
hourHand.rotation.z = -Math.PI / 6;
scene.add(hourHand);
const minHand = new THREE.Mesh(new THREE.PlaneGeometry(0.025, 0.32), handMat);
minHand.position.set(0, 3.0 + 0.12, -9.91);
minHand.rotation.z = Math.PI / 3;
scene.add(minHand);

/* ============ نوافذ (الجدار الأيمن) ============ */
function addWindow(y, z) {
  const frame = new THREE.Mesh(
    new THREE.PlaneGeometry(2.8, 2.0),
    new THREE.MeshStandardMaterial({ color: 0xFAFAFA })
  );
  frame.position.set(HALF - 0.06, y, z);
  frame.rotation.y = -Math.PI / 2;
  scene.add(frame);

  const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(2.5, 1.7),
    new THREE.MeshStandardMaterial({
      color: 0xB8E0F5,
      emissive: 0x88C0E0,
      emissiveIntensity: 0.5,
      roughness: 0.2
    })
  );
  glass.position.set(HALF - 0.08, y, z);
  glass.rotation.y = -Math.PI / 2;
  scene.add(glass);

  // فاصل أفقي
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.06, 2.5),
    new THREE.MeshStandardMaterial({ color: 0xFAFAFA })
  );
  bar.position.set(HALF - 0.09, y, z);
  scene.add(bar);
}
addWindow(2.2, -3.5);
addWindow(2.2,  3.5);

/* ============ ملصقات على الجدار الأيسر ============ */

}

/* ============ التحكم بالكاميرا ============ */
let controls = null;
let yaw = 0, pitch = 0;

if (!isMobileMode) {
  controls = new PointerLockControls(camera, renderer.domElement);
  controls.addEventListener('lock', () => {
    document.body.classList.add('playing');
    overlay.style.display = 'none';
    crosshair.style.display = 'block';
  });
  controls.addEventListener('unlock', () => {
    document.body.classList.remove('playing');
    overlay.style.display = 'flex';
    crosshair.style.display = 'none';
  });
}

/* ============ المدخلات ============ */
const keys = Object.create(null);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* --- عصا التحكم --- */
let joyTouchId = null;
let joyVX = 0, joyVY = 0;

function updateJoystick(t) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  const max = rect.width / 2 - 8;
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
  joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVX = dx / max;
  joyVY = dy / max;
}
function endJoy(id) {
  if (id === joyTouchId) {
    joyTouchId = null;
    joyVX = 0; joyVY = 0;
    joystickKnob.style.transform = 'translate(-50%, -50%)';
    joystick.classList.remove('active');
  }
}

if (isMobileMode) {
  joystick.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    if (joyTouchId !== null) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    joystick.classList.add('active');
    updateJoystick(t);
  }, { passive: false });
}

/* --- زر القفز --- */
let jumpHeld = false;
if (isMobileMode) {
  jumpBtn.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    jumpHeld = true;
    jumpBtn.classList.add('pressed');
  }, { passive: false });
  jumpBtn.addEventListener('touchend', () => { jumpHeld = false; jumpBtn.classList.remove('pressed'); });
  jumpBtn.addEventListener('touchcancel', () => { jumpHeld = false; jumpBtn.classList.remove('pressed'); });
}

/* --- النظر بالسحب --- */
let lookTouchId = null;
let lastLookX = 0, lastLookY = 0;

if (isMobileMode) {
  renderer.domElement.addEventListener('touchstart', e => {
    if (!document.body.classList.contains('playing')) return;
    for (const t of e.changedTouches) {
      if (lookTouchId === null) {
        lookTouchId = t.identifier;
        lastLookX = t.clientX;
        lastLookY = t.clientY;
      }
    }
  }, { passive: true });
}

document.addEventListener('touchmove', e => {
  let handled = false;
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      updateJoystick(t);
      handled = true;
    } else if (t.identifier === lookTouchId) {
      const dx = t.clientX - lastLookX;
      const dy = t.clientY - lastLookY;
      lastLookX = t.clientX;
      lastLookY = t.clientY;
      yaw -= dx * LOOK_SENS;
      pitch -= dy * LOOK_SENS;
      pitch = Math.max(-1.5, Math.min(1.5, pitch));
      handled = true;
    }
  }
  if (handled) e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    endJoy(t.identifier);
    if (t.identifier === lookTouchId) lookTouchId = null;
  }
});
document.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) {
    endJoy(t.identifier);
    if (t.identifier === lookTouchId) lookTouchId = null;
  }
});

/* ============ بدء اللعبة ============ */
function tryFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) { try { Promise.resolve(req.call(el)).catch(() => {}); } catch (e) {} }
}

function startGame() {
  if (isMobileMode) {
    document.body.classList.add('playing');
    overlay.style.display = 'none';
    crosshair.style.display = 'block';
    tryFullscreen();
  } else {
    controls.lock();
  }
}

overlay.addEventListener('click', startGame);
startBtn.addEventListener('click', e => { e.stopPropagation(); startGame(); });

fsBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    tryFullscreen();
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});

/* ============ فيزياء اللاعب ============ */
let verticalVel = 0;
let playerY = EYE_HEIGHT;
let onGround = true;

function collides(x, z) {
  if (x < -HALF + RADIUS || x > HALF - RADIUS || z < -HALF + RADIUS || z > HALF - RADIUS) return true;
  for (const c of colliders) {
    if (x > c.minX - RADIUS && x < c.maxX + RADIUS &&
        z > c.minZ - RADIUS && z < c.maxZ + RADIUS) return true;
  }
  return false;
}

/* ============ حلقة الرسم ============ */
const clock = new THREE.Clock();
const forward = new THREE.Vector3();
const right   = new THREE.Vector3();
const UP      = new THREE.Vector3(0, 1, 0);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const playing = document.body.classList.contains('playing');

  if (isMobileMode && playing) {
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    camera.rotation.z = 0;
  }

  if (playing) {
    camera.getWorldDirection(forward);
    forward.y = 0;
    if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
    forward.normalize();
    right.crossVectors(forward, UP).normalize();

    let magX = 0, magZ = 0;
    if (keys['KeyW'] || keys['ArrowUp'])    { magX += forward.x; magZ += forward.z; }
    if (keys['KeyS'] || keys['ArrowDown'])  { magX -= forward.x; magZ -= forward.z; }
    if (keys['KeyD'] || keys['ArrowRight']) { magX += right.x;   magZ += right.z; }
    if (keys['KeyA'] || keys['ArrowLeft'])  { magX -= right.x;   magZ -= right.z; }

    if (isMobileMode && (joyVX || joyVY)) {
      magX += forward.x * (-joyVY) + right.x * joyVX;
      magZ += forward.z * (-joyVY) + right.z * joyVX;
    }

    const magLen = Math.hypot(magX, magZ);
    if (magLen > 1) { magX /= magLen; magZ /= magLen; }

    const running = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = SPEED * (running ? RUN_MULT : 1) * dt;

    const p = camera.position;
    const nx = p.x + magX * speed;
    if (!collides(nx, p.z)) p.x = nx;
    const nz = p.z + magZ * speed;
    if (!collides(p.x, nz)) p.z = nz;

    const wantJump = keys['Space'] || (isMobileMode && jumpHeld);
    if (wantJump && onGround) {
      verticalVel = JUMP_FORCE;
      onGround = false;
    }

    verticalVel -= GRAVITY * dt;
    playerY += verticalVel * dt;
    if (playerY <= EYE_HEIGHT) {
      playerY = EYE_HEIGHT;
      verticalVel = 0;
      onGround = true;
    }
    camera.position.y = playerY;
  }

  renderer.render(scene, camera);
}

/* ============ حجم الشاشة ============ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

addEventListener('scroll', () => scrollTo(0, 0));

animate();
</script>
